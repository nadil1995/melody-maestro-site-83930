        <h1>Lashikala Hettiarachchi — Sri Lankan Flautist &amp; Composer based in the UK</h1>
        <p>Professional flautist and composer based in Croydon, London, United Kingdom. LTCL (Licentiate of Trinity College London) and Visharad qualified. Offering Western flute lessons and Indian flute (Bansuri) lessons in Croydon, London, and Surrey. Online flute lessons available worldwide.</p>

        <h2>Flute Lessons &amp; Services — Croydon, London, Surrey</h2>
        <ul>
          <li>Western Flute Lessons — Croydon, London, Surrey. Beginner to advanced. Classical flute technique, repertoire, exam preparation (ABRSM, Trinity), performance preparation, breath control.</li>
          <li>Indian Flute Lessons — Bansuri and bamboo flute. North Indian classical style. Croydon, London, Surrey and online.</li>
          <li>Western Music Theory — Notation, sight-reading, harmony, composition, ear training, music history.</li>
          <li>Indian Music Theory — Raaga, Indian notation, ear training, Indian classical music history.</li>
          <li>Mind Relaxation through Music — Guided listening, breathing techniques, mindfulness, therapeutic flute music.</li>
          <li>Online Flute Lessons — Available to students worldwide.</li>
          <li>Flexible sessions: 30, 45, or 60 minutes. Weekly or bi-weekly. Beginners welcome. Adults and children.</li>
        </ul>

        <h2>About Lashikala Hettiarachchi</h2>
        <p>I am a classically trained flautist and composer based in the United Kingdom, dedicated to exploring diverse musical traditions and creating meaningful connections through music.</p>
        <p>I hold a Master's degree in International Music Management from the University for the Creative Arts, UK, and a Bachelor's degree from the University of the Visual and Performing Arts, Sri Lanka. My qualifications include the Licentiate of Trinity College London (LTCL) and Visharad from Bhatkhande Sangeet Vidyapith, Lucknow.</p>
        <p>I perform as a member of the <a href="https://www.justflutes.com/apps/flute-ensemble-finder/just-flutes-community-flute-choir" rel="noopener noreferrer">Just Flute Orchestra, UK</a>. My career in Sri Lanka includes serving as Principal Flautist for the Gustav Mahler Society and the National Unity Orchestra, as well as performing with the National Symphony Orchestra. I began my orchestral journey with the Colombo Wind Orchestra and the National Youth Orchestra. As a member of <a href="https://www.viraagastudio.com/about-us" rel="noopener noreferrer">Viraaga Orchestra</a> I am dedicated to bring Sri Lankan music for British Sri Lankans who live in the UK.</p>
        <p>I have been recognised four times by the National Youth Awards (2012, 2015, 2017, 2019), receiving first place in the North Indian Classical Instrumental Flute category.</p>
        <p>Compositions: "Ambivalence of Life" — original composition blending Indian classical ragas with Western harmony, written for flute, violin, viola, and cello. "Me Nagaraya" — arrangement of the Sri Lankan song for four bamboo flutes in SATB formation.</p>

        <h2>Concerts &amp; Performances</h2>
        <ul>
          <li>Miyuru Gee Dahana — Glasgow, United Kingdom</li>
          <li>Hadha Randhi Miyuru Gee Suyamaya — High Wycombe, United Kingdom</li>
          <li>Bank of Ceylon London Branch 75th Anniversary Concert — London, United Kingdom</li>
          <li>Pawan Podak Concert</li>
          <li>Candlelight Solo Flute Performance</li>
          <li>Gustav Mahler Orchestra Sri Lanka Concert</li>
          <li>Colombo Wind Orchestra Performances — Colombo, Sri Lanka</li>
          <li>Tambourin by François-Joseph Gossec — flute performance</li>
          <li>Raag Brindavani — Indian classical flute performance</li>
          <li>Me Nagaraya SATB Flute Cover by LFlauto</li>
        </ul>

        <h2>Contact</h2>
        <p>Location: Croydon, London, United Kingdom. Serving Croydon, London, Surrey and surrounding areas. Online lessons available worldwide.</p>
        <p>Email: madhuhettiarachchi4@gmail.com</p>
        <p>Lesson hours: Monday–Friday 4:00 PM–8:00 PM, Saturday 10:00 AM–4:00 PM, Sunday by appointment.</p>
